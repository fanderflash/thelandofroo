<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Hammerhill in The Land of Roo</title><desc id="d">A dark northern fantasy landscape with a timber smithing settlement built around monumental ancient Vanir stonework.</desc>
<defs>
