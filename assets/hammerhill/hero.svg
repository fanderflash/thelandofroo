  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66716d"/><stop offset="1" stop-color="#222b2b"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#f4c56c" stop-opacity=".95"/><stop offset="1" stop-color="#b36d24" stop-opacity="0"/></radialGradient>
  <filter id="fog"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
